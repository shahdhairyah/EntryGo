<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EntryGo · Free QR passes for your club event</title>
  <meta name="description"
    content="Upload your registrations sheet, everyone gets a QR pass, any phone becomes the gate scanner. Screenshots work once. Free and open source.">
  <meta name="theme-color" content="#090D16">
  <meta property="og:title" content="EntryGo: free QR entry for club events">
  <meta property="og:description"
    content="Upload your registrations. Everyone gets a pass. Any phone scans at the gate. Screenshots work once.">
  <meta property="og:image" content="assets/art/crowd.jpg">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/oswald-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/gatepass.css">
  <script defer src="config.js"></script>
  <script defer src="vendor/supabase.js"></script>
  <script type="module" src="assets/js/organiser.js"></script>

  <link rel="manifest" href="./manifest.json">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => { });
      });
    }
  </script>

</head>

<body class="wide">
  <!--
THESIS: The organiser's dashboard is the event's gig poster with the box office stapled under it: art and title on top, then the registrations sheet, one blue "Generate N passes" plate, and the live "Checked in N / total". Refuses the SaaS admin (sidebar, KPI tiles, data grid).
OWN-WORLD: Warm paper #F3EBEA with fibre grain; fluoro pink #FF2FA2 and deep blue #1A43B4 riso inks with paper dropouts on filled surfaces; pink-tint #F8D5E4 rows with 12px corners; Oswald condensed print voice, Barlow Semi Condensed for reading; dotted pink rules; scalloped stub at the foot.
STORY: Sign in with a magic link, make the event, drop in the sheet, generate passes, send links yourself, hand staff the gate code, watch the counter climb.
FIRST VIEWPORT: (event) GatePass wordmark + ORGANISER; square riso poster with the title in fluoro pink and the club in blue; registrations row; blue Generate plate; Checked-in card with the pink bar.
FORM: Pinned by the user: concept A "gig poster" (ui-concepts/gatepass/gatepass_a_gigposter.png). No seed roll: user-pinned.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <main class="app">
    <header class="mast">
      <div class="brand-group">
        <a class="brand-link" href="./" id="home">
          <img class="brand-logo-img" src="assets/img/logo.png" alt="EntryGo Logo">
          <span class="logo ink">EntryGo</span>
        </a>
        <a class="brand-by" href="https://www.shahdhairyah.in/" target="_blank" rel="noopener">By Shah Dhairya</a>
      </div>
      <span class="mast-role" id="role">Organiser</span>
    </header>
    <div id="view" aria-live="polite">
      <div class="skeleton" style="height:420px"></div>
    </div>
            <footer class="foot">
      <!-- Top Brand Row with Live Pill & Neon Email Capsule -->
      <div class="foot-top-row">
        <div class="foot-brand-col">
          <img src="assets/img/logo.png" alt="EntryGo" style="width:34px;height:34px;border-radius:10px;box-shadow:0 0 15px rgba(56,189,248,0.35)">
          <div style="text-align:left">
            <div style="display:flex;align-items:center;gap:8px">
              <strong style="font-family:var(--f-display);font-size:24px;letter-spacing:0.04em;color:#F8FAFC">EntryGo</strong>
              <span style="font-size:10px;font-weight:800;color:#38BDF8;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.3);padding:2px 8px;border-radius:12px;letter-spacing:0.05em">LIVE PRO</span>
            </div>
            <p style="margin:2px 0 0;font-size:12px;color:#94A3B8">High-Velocity QR Event Admission Engine</p>
          </div>
        </div>
        <a class="foot-contact-pill" href="mailto:entrygo.live@shahdhairyah.in" title="Direct inquiries & technical support">
          <span class="mail-icon-glow">✉</span>
          <span>entrygo.live@shahdhairyah.in</span>
        </a>
      </div>

      <!-- Creative Navigation Pills -->
      <div class="foot-nav-capsules">
        <a class="foot-nav-item" href="./">🎪 Organiser Console</a>
        <a class="foot-nav-item" href="./gate/">⚡ Gate Scanner</a>
        <a class="foot-nav-item" href="./p/">🎟️ Pass Viewer</a>
        <a class="foot-nav-item" href="./sitemap.xml" target="_blank" rel="noopener">🗺️ Sitemap</a>
        <a class="foot-nav-item" href="https://github.com/shahdhairyah/EntryGo" target="_blank" rel="noopener">🐙 GitHub Source</a>
      </div>

      <!-- Bottom Metadata with Developer Link -->
      <div class="foot-bottom-line">
        <span>© 2026 EntryGo · Engineered by <a href="https://www.shahdhairyah.in/" target="_blank" rel="noopener" style="color:#38BDF8;font-weight:700;text-decoration:none">Shah Dhairya</a></span>
        <span style="display:inline-flex;align-items:center;gap:6px;color:#94A3B8">
          <span style="width:7px;height:7px;border-radius:50%;background:#10B981;box-shadow:0 0 8px #10B981"></span>
          <span>192-bit Cryptographic QR System</span>
        </span>
      </div>
    </footer>
    <div class="scallops inked" aria-hidden="true"></div>
  </main>
</body>

</html>
