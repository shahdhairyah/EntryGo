<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Pass · EntryGo Official Digital Pass</title>
<meta name="description" content="Your official EntryGo cryptographic digital entry pass. Show the QR at the gate.">
<meta name="theme-color" content="#090D16">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/oswald-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/gatepass.css">
<script defer src="../config.js"></script>
<script type="module" src="../assets/js/pass.js"></script>

  <link rel="manifest" href="../manifest.json">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("../sw.js").catch(() => {});
      });
    }
  </script>

</head>
<body class="pass-user-body">
<main class="app">
  <!-- High-Level Clean Header for Attendee View -->
    <header class="main-navbar user-pass-navbar">
    <div class="nav-brand-container">
      <a class="nav-brand-link" href="../" title="Return to Home">
        <div class="nav-logo-box">
          <img class="nav-logo-img" src="../assets/img/logo.png" alt="EntryGo Logo">
        </div>
        <div class="nav-title-group">
          <span class="nav-title-text">EntryGo</span>
          <span class="nav-version-tag">VERIFIED PASS</span>
        </div>
      </a>
    </div>

    <!-- Official Security Badge -->
    <div class="nav-actions-slot">
      <div class="nav-status-capsule">
        <span class="pulse-indicator-dot"></span>
        <span>OFFICIAL PASS</span>
      </div>
    </div>
  </header>

  <!-- Pass View Slot -->
  <div id="view" aria-live="polite">
    <div class="skeleton" style="height:min(150vw,720px)" aria-label="Loading your pass"></div>
  </div>

  <!-- High-Level User Footer with Official Support -->
  <footer class="user-pass-footer">
    <div class="user-foot-brand-row">
      <div style="display:flex;align-items:center;gap:8px">
        <strong style="font-family:var(--f-display);font-size:20px;letter-spacing:0.04em;color:#F8FAFC">EntryGo</strong>
        <span style="font-size:10px;font-weight:700;color:#38BDF8;background:rgba(56,189,248,0.15);padding:2px 7px;border-radius:10px">VERIFIED PASS</span>
      </div>
      <a href="../" style="font-size:11.5px;color:#94A3B8;text-decoration:none">Create Event ➔</a>
    </div>

    <!-- Official Inquiries & Support -->
    <div class="user-foot-support-box">
      <span class="user-support-label">Need assistance with your pass or event?</span>
      <a class="user-contact-pill" href="mailto:entrygo.live@shahdhairyah.in" title="Official Support & Assistance">
        <span style="font-size:13px">✉️</span>
        <span>entrygo.live@shahdhairyah.in</span>
      </a>
    </div>

    <!-- Copyright & Integrity Assurance -->
    <div class="user-foot-copyright">
      <span>© 2026 EntryGo · Developed by <a href="https://www.shahdhairyah.in/" target="_blank" rel="noopener" style="color:#38BDF8;font-weight:700;text-decoration:none">Shah Dhairya</a></span>
      <span>192-bit Cryptographic Security</span>
    </div>
  </footer>
  <div class="scallops inked" aria-hidden="true"></div>
</main>
</body>
</html>
