[[redirects]]
  from = "/gate"
  to = "/gate/index.html"
  status = 200

[[redirects]]
  from = "/p"
  to = "/p/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
