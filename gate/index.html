<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gate Scanner · EntryGo</title>
<meta name="description" content="Turn this phone into the gate scanner for a EntryGo event.">
<meta name="theme-color" content="#090D16">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/oswald-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/gatepass.css">
<script defer src="../config.js"></script>
<script type="module" src="../assets/js/gate.js"></script>
</head>
<body>
<!--
EntryGo Gate Scanner: Optical camera HUD with real-time audio haptic feedback and atomic fraud locks.
-->
<main class="app">
  <header class="mast">
    <a class="logo ink" href="../">EntryGo</a>
    <span class="mast-role quiet">Gate Scanner</span>
  </header>

  <!-- join -->
  <section id="join" class="stack" hidden>
    <h1 class="head">Join a gate</h1>
    <p class="sub">Type the event's gate code from the organiser. No account needed.</p>
    <form id="joinForm" class="stack" novalidate>
      <label class="field">
        <span>Gate code</span>
        <input class="input code-input" id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" maxlength="9" placeholder="••••-••••" aria-describedby="joinErr" required>
      </label>
      <fieldset class="field" style="border:0;margin:0;padding:0">
        <span>This gate</span>
        <div class="chips" id="gateChips">
          <label class="chip"><input type="radio" name="gate" value="Gate 1" checked><span>Gate 1</span></label>
          <label class="chip"><input type="radio" name="gate" value="Gate 2"><span>Gate 2</span></label>
          <label class="chip"><input type="radio" name="gate" value="Gate 3"><span>Gate 3</span></label>
          <label class="chip"><input type="radio" name="gate" value="Desk"><span>Desk</span></label>
        </div>
      </fieldset>
      <p class="err" id="joinErr" role="alert" hidden></p>
      <button class="btn-primary compact" id="joinBtn" type="submit"><span class="label">Open scanner</span><span class="arrow" data-i="arrow"></span></button>
    </form>
    <p class="fine">Organiser? <a href="../">Sign in to make passes</a>.</p>
  </section>

  <!-- scanner -->
  <section id="scan" hidden>
    <div class="scan-head">
      <p class="scan-event" id="evName"></p>
      <span class="scan-gate" id="gateName"></span>
      <button class="leave" type="button" id="leaveBtn">Leave</button>
    </div>
    <div class="viewport" id="viewport">
      <div class="hud-tag">
        <span class="live-dot"></span>
        <span>OPTICAL HUD ACTIVE</span>
      </div>
      <video id="video" playsinline muted></video>
      <div class="brackets" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="cam-tools">
        <span id="camTools" style="display:contents"></span>
        <button class="icon-btn" type="button" id="findBtn" aria-label="Find a guest by name" title="Find by name"></button>
        <label class="icon-btn" title="Scan a photo of a pass"><input type="file" accept="image/*" id="photo" class="sr" aria-label="Scan a photo of a pass"><span id="photoLbl"></span></label>
      </div>
      <div class="cam-msg" id="camMsg"></div>
    </div>

    <div class="verdict idle" id="verdict" role="status" aria-live="assertive"></div>

    <div class="counter" id="counter">
      <span class="c-label">Checked in</span>
      <span class="c-num" id="cNum">0 / 0</span>
      <div class="bar"><i id="cBar"></i></div>
    </div>

    <div class="gate-recent" style="margin-top:16px">
      <h3 class="recent-title" style="font-size:14px;color:#94A3B8;margin-bottom:8px;font-family:var(--f-display);letter-spacing:0.04em">Recent Scans</h3>
      <ul class="recent-list" id="recent"></ul>
    </div>
  </section>

  <div id="flash" class="flash" aria-hidden="true"></div>

  <!-- find by name modal -->
  <dialog id="findDlg" class="dlg">
    <div class="dlg-head">
      <h3>Find attendee</h3>
      <button class="icon-btn" type="button" id="closeFind" aria-label="Close">${I.x}</button>
    </div>
    <input class="input" type="search" id="findQ" placeholder="Type a name…" autocomplete="off">
    <ul class="find-list" id="findList"></ul>
  </dialog>

  <footer class="foot">
    <span>Made by <a href="https://www.shahdhairyah.in/" rel="noopener">Shah Dhairya H</a></span>
  </footer>
</main>
</body>
</html>
